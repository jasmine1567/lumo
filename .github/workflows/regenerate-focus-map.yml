name: Regenerate official N03 focus map
on:
  push:
    paths:
      - "scripts/build_focus_map.py"
      - ".github/workflows/regenerate-focus-map.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install system font and Python libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check geopandas shapely pyproj pillow pyogrio
      - name: Generate zoomed map from MLIT official source
        run: python scripts/build_focus_map.py
      - name: Commit raster output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/area-map-focus.png
          if git diff --cached --quiet; then
            echo "No changes to image"
          else
            git commit -m "Update accurate Miyazaki/Miyakonojo focus map"
            git push
          fi
